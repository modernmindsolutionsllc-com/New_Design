    <meta name="theme-color" content="#F7F9FF" />
    <script>
      (function () {
        var themeKey = 'modernmind-theme'
        var storedTheme = localStorage.getItem(themeKey)
        var preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : preferredTheme
        var themeColor = theme === 'dark' ? '#0F1B34' : '#F7F9FF'

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme

        var metaTheme = document.querySelector('meta[name="theme-color"]')
        if (metaTheme) {
          metaTheme.setAttribute('content', themeColor)
        }
      })()
    </script>

    <link rel="canonical" href="https://www.modernmindllc.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const replacementText = 'We reply within 5-6 hrs on weekends';
        const matcher = /24\s*hrs?|24\s*hours?/i;
        const locationText = 'Boston, Massachusetts, US · Ahmedabad, Gujarat, India';

        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        const nodes = [];

        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (matcher.test(node.textContent || '')) {
            nodes.push(node);
          }
        }

        nodes.forEach((node) => {
          node.textContent = (node.textContent || '').replace(matcher, '5-6 hrs');
          if (/reply/i.test(node.textContent)) {
            node.textContent = replacementText;
          }
        });

        const footer = document.querySelector('footer');
        if (!footer) {
          return;
        }

        const footerWalker = document.createTreeWalker(footer, NodeFilter.SHOW_TEXT);
        const locationNodes = [];

        while (footerWalker.nextNode()) {
          const node = footerWalker.currentNode;
          if (/boston|ahmedabad|massachusetts/i.test(node.textContent || '')) {
            locationNodes.push(node);
          }
        }

        if (locationNodes.length > 0) {
          locationNodes[0].textContent = locationText;
          locationNodes.slice(1).forEach((node) => {
            const parent = node.parentNode;
            if (parent) {
              parent.removeChild(node);
            }
          });
        }
      });
    </script>
  </body>
