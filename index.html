<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ModernMind Solutions LLC | Web, Mobile & AI Development</title>

    <meta

      content="web development, mobile apps, AI automation, UI UX design, Oracle Fusion HCM, software agency"
    />
    <meta name="author" content="ModernMind Solutions LLC" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.modernmindllc.com/" />
    <meta property="og:title" content="ModernMind Solutions LLC" />
    <meta
      property="og:description"
      content="Innovative technology solutions for modern businesses — web, mobile, AI, and Oracle HCM."
    />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ModernMind Solutions LLC" />
    <meta
      name="twitter:description"
      content="Innovative technology solutions for modern businesses — web, mobile, AI, and Oracle HCM."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#F7F9FF" />
    <script>
      (function () {
        var themeKey = 'modernmind-theme'
        var storedTheme = localStorage.getItem(themeKey)
        var preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : preferredTheme
        var themeColor = theme === 'dark' ? '#0F1B34' : '#F7F9FF'

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme

        var metaTheme = document.querySelector('meta[name="theme-color"]')
        if (metaTheme) {
          metaTheme.setAttribute('content', themeColor)
        }
      })()
    </script>

    <link rel="canonical" href="https://www.modernmindllc.com/" />
    <meta name="theme-color" content="#0B1228" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const socialProfiles = {
          linkedin:
            'https://www.linkedin.com/company/modern-mind-solutions-llc/posts/?feedView=all',
          facebook:
            'https://www.facebook.com/people/Modern-Mind-Solutions-LLC/61590709372615/',
          instagram: 'https://www.instagram.com/hr_services2026/',
          x: 'https://x.com/ModernMindSols',
        };

        const normalize = (value) => (value || '').replace(/\s+/g, ' ').trim().toLowerCase();

        const applySocialLinks = () => {
          document.querySelectorAll('a').forEach((anchor) => {
            const label = normalize(
              [
                anchor.getAttribute('aria-label'),
                anchor.getAttribute('title'),
                anchor.dataset?.social,
                anchor.className,
                anchor.textContent,
              ].join(' ')
            );

            if (label.includes('linkedin')) {
              anchor.href = socialProfiles.linkedin;
              anchor.target = '_blank';
              anchor.rel = 'noreferrer';
            } else if (label.includes('facebook')) {
              anchor.href = socialProfiles.facebook;
              anchor.target = '_blank';
              anchor.rel = 'noreferrer';
            } else if (label.includes('instagram')) {
              anchor.href = socialProfiles.instagram;
              anchor.target = '_blank';
              anchor.rel = 'noreferrer';
            } else if (label.includes('twitter') || label === 'x' || label.includes(' x ')) {
              anchor.href = socialProfiles.x;
              anchor.target = '_blank';
              anchor.rel = 'noreferrer';
            }
          });
        };

        const injectFooterContent = () => {
          const footer = document.querySelector('footer');
          if (!footer) {
            return false;
          }

          const connectHeading = Array.from(
            footer.querySelectorAll('h1, h2, h3, h4, h5, h6, p, span, div')
          ).find((node) => normalize(node.textContent) === 'connect');

          if (connectHeading) {
            const connectColumn = connectHeading.closest('div, section, article');
            if (connectColumn && !connectColumn.querySelector('[data-mms-social-stack]')) {
              Array.from(connectColumn.querySelectorAll('a')).forEach((anchor) => {
                const text = normalize(anchor.textContent);
                const label = normalize(
                  [
                    anchor.getAttribute('aria-label'),
                    anchor.getAttribute('title'),
                    anchor.dataset?.social,
                  ].join(' ')
                );

                if (text === 'linkedin' || label === 'linkedin' || text === 'email us' || label === 'email us') {
                  anchor.remove();
                }
              });

              const socialStack = document.createElement('div');
              socialStack.setAttribute('data-mms-social-stack', 'true');
              socialStack.style.display = 'grid';
              socialStack.style.gap = '8px';
              socialStack.style.marginTop = '4px';

              [
                ['LinkedIn', socialProfiles.linkedin],
                ['Facebook', socialProfiles.facebook],
                ['Instagram', socialProfiles.instagram],
                ['X', socialProfiles.x],
              ].forEach(([label, href]) => {
                const link = document.createElement('a');
                link.textContent = label;
                link.href = href;
                link.target = '_blank';
                link.rel = 'noreferrer';
                link.style.color = 'inherit';
                link.style.textDecoration = 'none';
                link.style.display = 'inline-flex';
                link.style.alignItems = 'center';
                link.style.width = 'fit-content';
                link.style.lineHeight = '1.1';
                socialStack.appendChild(link);
              });

              const email = document.createElement('a');
              email.textContent = 'info@modernmindsolutionsllc.com';
              email.href = 'mailto:info@modernmindsolutionsllc.com';
              email.style.color = 'inherit';
              email.style.textDecoration = 'none';
              email.style.display = 'inline-flex';
              email.style.alignItems = 'center';
              email.style.width = 'fit-content';
              email.style.lineHeight = '1.1';
              socialStack.appendChild(email);

              connectColumn.appendChild(socialStack);
            }
          }

          return true;
        };

        applySocialLinks();
        if (!injectFooterContent()) {
          const observer = new MutationObserver(() => {
            applySocialLinks();
            if (injectFooterContent()) {
              observer.disconnect();
            }
          });

          observer.observe(document.documentElement, { childList: true, subtree: true });
          window.setTimeout(() => observer.disconnect(), 8000);
        }
      });
    </script>
  </body>
</html>
